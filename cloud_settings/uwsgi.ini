[uwsgi]
socket          = 127.0.0.1:8000
chdir           = /home/acs/roamio
wsgi-file       = roamio/wsgi.py
master          = true
processes       = 4
threads         = 10
vacuum          = true

logto           = /home/acs/roamio/uwsgi.log
static-map      = /media=/home/acs/roamio/media

# UTF-8 编码配置（必须）
env             = LANG=en_US.UTF-8
env             = LC_ALL=en_US.UTF-8
env             = LC_CTYPE=en_US.UTF-8
env             = PYTHONIOENCODING=UTF-8
env             = PYTHONHASHSEED=random
env             = PYTHONUNBUFFERED=1

# Django 设置
env = DJANGO_SETTINGS_MODULE=roamio.settings

# 邮件配置（默认值，会被 .env 覆盖）
env = USE_REAL_EMAIL=0
env = EMAIL_HOST=smtp.qq.com
env = EMAIL_PORT=587
env = EMAIL_USE_SSL=False
env = EMAIL_USE_TLS=True
# ⚠️ 邮箱配置请在 .env 文件中设置，不要在这里硬编码
# env = EMAIL_HOST_USER=your_email@qq.com
# env = EMAIL_HOST_PASSWORD=your_password_here
# env = DEFAULT_FROM_EMAIL=Roamio <your_email@qq.com>

# 加载 .env 文件（会覆盖上面的默认值）
envfile = /home/acs/roamio/.env

# Redis 配置（强制启用）
env = USE_REDIS_CACHE=1
env = REDIS_HOST=127.0.0.1
env = REDIS_PORT=6379
env = REDIS_DB=0

# COS 配置（必须在 .env 中配置）
# env = TENCENT_COS_SECRET_ID=your_id
# env = TENCENT_COS_SECRET_KEY=your_key
# env = TENCENT_COS_BUCKET=your_bucket
# env = TENCENT_COS_REGION=ap-guangzhou


# ⚠️ 邮件配置已移至 .env 文件
# 请在服务器上的 /home/acs/roamio/.env 文件中配置
# 不要在这里硬编码敏感信息！
