# ============================================================
# Roamio Nginx 配置 - 前后端分离版本
# ============================================================
# 
# 使用方法：
# 1. 备份当前配置: sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.backup
# 2. 替换相关部分到 /etc/nginx/nginx.conf
# 3. 测试配置: sudo nginx -t
# 4. 重载配置: sudo systemctl reload nginx
#
# ============================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;

    # ============================================================
    # HTTP 重定向到 HTTPS
    # ============================================================
    server {
        listen 80;
        server_name app7508.acapp.acwing.com.cn;
        rewrite ^(.*)$ https://${server_name}$1 permanent;
    }

    # ============================================================
    # HTTPS 主配置 - 前后端分离版本
    # ============================================================
    server {
        listen 443 ssl;
        server_name app7508.acapp.acwing.com.cn;

        ssl_certificate   cert/acapp.pem;
        ssl_certificate_key  cert/acapp.key;
        ssl_session_timeout 5m;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_prefer_server_ciphers on;

        charset utf-8;
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # 增加文件上传限制（500MB）
        client_max_body_size 500M;
        client_body_timeout 300s;

        # ============================================================
        # 后端 API（Django REST Framework）
        # 注意：必须放在 location / 之前，否则会被前端路由拦截
        # ============================================================
        location /api {
            include /etc/nginx/uwsgi_params;
            uwsgi_pass 127.0.0.1:8000;
            
            # 增加超时时间（5分钟）
            uwsgi_connect_timeout 300;
            uwsgi_send_timeout 300;
            uwsgi_read_timeout 300;
            
            # 缓冲区配置
            uwsgi_buffer_size 128k;
            uwsgi_buffers 4 256k;
            uwsgi_busy_buffers_size 256k;
        }

        # ============================================================
        # Django Admin（后端管理界面）
        # ============================================================
        location /admin {
            include /etc/nginx/uwsgi_params;
            uwsgi_pass 127.0.0.1:8000;
            
            # 增加超时时间
            uwsgi_connect_timeout 300;
            uwsgi_send_timeout 300;
            uwsgi_read_timeout 300;
            
            # 缓冲区配置
            uwsgi_buffer_size 128k;
            uwsgi_buffers 4 256k;
            uwsgi_busy_buffers_size 256k;
        }

        # ============================================================
        # 前端静态文件（Vue SPA）- 直接访问 dist 目录
        # 注意：这个必须放在最后，因为它会匹配所有路径
        # ============================================================
        location / {
            root /home/acs/roamio/web/dist;
            try_files $uri $uri/ /index.html;  # SPA 路由支持
            
            # 缓存策略
            # index.html 不缓存（确保总是最新）
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires 0;
            }
            
            # JS/CSS 文件长期缓存（带 hash）
            location ~* \.(js|css)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
            
            # 图片文件长期缓存
            location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
            
            # 字体文件
            location ~* \.(woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # ============================================================
        # Django Admin 静态文件
        # ============================================================
        location /admin-static {
            alias /home/acs/roamio/staticfiles/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ============================================================
        # 媒体文件（已迁移到 COS，保留用于向后兼容）
        # ============================================================
        location /media {
            alias /home/acs/roamio/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ============================================================
        # WebSocket 代理
        # ============================================================
        location /wss {
            proxy_pass http://127.0.0.1:5015;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ============================================================
        # 安全头部
        # ============================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}

