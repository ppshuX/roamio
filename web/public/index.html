<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="<%= BASE_URL %>roamio.ico">
  <link rel="apple-touch-icon" href="<%= BASE_URL %>logo_Roamio.png">
  <title>
    <%= htmlWebpackPlugin.options.title %>
  </title>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- 百度地图 API (使用 Ralendar 团队提供的 Key) - 异步加载 -->
  <script async defer src="https://api.map.baidu.com/api?v=3.0&ak=i8UmOotWSekjTJlPbydOk1xQZuUeGeE1"></script>
  <!-- 高德地图 API (加载 Geocoder 插件) - 异步加载 -->
  <script>
    window._AMapSecurityConfig = {
      securityJsCode: '91443bbb1947cadce8fee87d0d84fe01'
    }
  </script>
  <script async defer src="https://webapi.amap.com/maps?v=2.0&key=53b6a185427e97b53e16c8786a272f62&plugin=AMap.Geocoder"></script>
  <style>
    /* 全局重置 - 移除浏览器默认边距 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled.
        Please enable it to continue.</strong>
  </noscript>
  <div id="app"></div>
  <!-- built files will be auto injected -->
</body>

</html>
